    <script>
      // Áp chế độ tối trước khi React chạy để tránh nháy trắng
      try {
        var t = JSON.parse(localStorage.getItem("htt-settings") || "{}").state?.theme || "system";
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
